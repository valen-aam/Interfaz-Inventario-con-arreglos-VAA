<!DOCTYPE html>
<html lang="es">

<head>
   <meta charset="UTF-8">
   <title>Inventario Vale</title>

   <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

   <h1>Inventario</h1>

   <form>

      <label>Codigo</label>
      <input type="text" id="codigo">

      <label>Nombre</label>
      <input type="text" id="nombre">

      <label>Cantidad</label>
      <input type="text" id="cantidad">

      <label>Costo</label>
      <input type="text" id="costo">

      <br><br>

      <button type="button" id="btnAgregarP">
         Agregar producto
      </button>

      <button type="button" id="btnBuscar">
         Buscar por código
      </button>

      <button type="button" id="btnEliminar">
         Eliminar por código
      </button>

      <button type="button" id="btnInsertar">
         Insertar producto en una posición
      </button>

      <button type="button" id="btnRecuperar">
         Recuperar listado como texto
      </button>

      <button type="button" id="btnExtraer">
         Extraer primer producto
      </button>

      <button type="button" id="btnAgregarInicio">
         Agregar producto al inicio
      </button>

      <button type="button" id="btnListar">
         Listar productos
      </button>

      <button type="button" id="btnListarInverso">
         Listar inverso
      </button>

   </form>

   <br>

   <div id="detalles"></div>


   <script src="js/Producto.js"></script>
   <script src="js/Inventario.js"></script>
   <script src="js/app.js"></script>

</body>

</html>
